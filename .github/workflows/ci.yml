name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

  binaries:
    name: Windows server binary
    runs-on: windows-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Build skript-lsp (release)
        run: cargo build --release -p skript-lsp

      - name: Stage bundled binary
        run: |
          New-Item -ItemType Directory -Force -Path extensions/vscode-skript/bin | Out-Null
          Copy-Item target/release/skript-lsp.exe extensions/vscode-skript/bin/skript-lsp-windows-x64.exe

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: skript-lsp-windows-x64
          path: extensions/vscode-skript/bin/skript-lsp-windows-x64.exe
          if-no-files-found: error

  vscode-extension:
    name: VSCode extension
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        working-directory: extensions/vscode-skript
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: extensions/vscode-skript
        run: bun run typecheck

      - name: Compile
        working-directory: extensions/vscode-skript
        run: bun run compile

      - name: Download Windows server binary
        uses: actions/download-artifact@v7
        with:
          name: skript-lsp-windows-x64
          path: extensions/vscode-skript/bin/

      - name: Package vsix
        working-directory: extensions/vscode-skript
        run: bun run package

      - name: Verify vsix bundles exactly one server binary
        working-directory: extensions/vscode-skript
        run: |
          set -euo pipefail
          listing=$(unzip -Z1 skript-lsp.vsix)
          echo "$listing"
          count=$(printf '%s\n' "$listing" | grep -c '^extension/bin/skript-lsp-' || true)
          test "$count" -eq 1
          printf '%s\n' "$listing" | grep -qx 'extension/bin/skript-lsp-windows-x64.exe'

      - name: Upload vsix
        uses: actions/upload-artifact@v7
        with:
          name: skript-lsp-vsix
          path: extensions/vscode-skript/*.vsix
          if-no-files-found: error
