[package]
name = "skript-registry"
version = "0.1.0"
edition = "2021"
description = "SkriptHub syntax corpus -> compiled pattern registry"

[dependencies]
skript-patterns = { path = "../skript-patterns" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "compile_corpus"
harness = false

[[bench]]
name = "refcell_vs_mutex"
harness = false

