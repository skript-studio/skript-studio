[package]
name = "skript-studio"
version = "0.1.0"
description = "Standalone desktop IDE for editing Minecraft Skript scripts"
authors = ["Skript Studio"]
license = "MIT"
repository = "https://github.com/skript-studio/skript-studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "skript_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"

serde = { workspace = true }
serde_json = { workspace = true }

# Async + logging
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Misc utilities
once_cell = "1"
parking_lot = "0.12"
reqwest = { workspace = true }

[features]
# This feature is used for production builds or when a dev server is not specified.
custom-protocol = ["tauri/custom-protocol"]
